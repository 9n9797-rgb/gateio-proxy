services:
  - type: web
    name: gateio-proxy-v2
    env: node
    region: oregon
    plan: starter

    buildCommand: "npm install"
    startCommand: "node server.js"
    autoDeploy: true

    # يستخدم Render متغير PORT تلقائياً — تأكد أن server.js يقرأ process.env.PORT
    healthCheckPath: "/healthz"
    healthCheckIntervalSeconds: 10
    healthCheckTimeoutSeconds: 5

    # قرص دائم لقاعدة بيانات SQLite (بدونه تُفقد بيانات المستخدمين عند كل إعادة نشر)
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: "production"
      # القديمة (اختيارية، فقط لنقاط /proxy/* أحادية المستخدم)
      - key: GATEIO_API_KEY
        sync: false
      - key: GATEIO_API_SECRET
        sync: false
      # إلزامي لتشفير مفاتيح Gate.io لكل مستخدم — أنشئه بـ: openssl rand -hex 32
      - key: APP_ENCRYPTION_KEY
        sync: false
      # بريد إرسال رمز الدخول (اختياري؛ بدونه يُطبع الرمز في السجلات فقط — غير مناسب للإنتاج)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # الذكاء الصناعي الاختياري (LLM) فوق المحرك الكمّي
      - key: OPENAI_API_KEY
        sync: false
      # حماية إلزامية: التداول الحقيقي يبقى معطّلاً ما لم تُفعّله عمداً
      - key: AUTOPILOT_ALLOW_LIVE
        value: "false"

    # (اختياري) تحويلات/روابط مختصرة
    routes:
      - type: rewrite
        source: "/openapi"
        destination: "/openapi.yaml"
      # مثال إعادة توجيه اختياري:
      # - type: redirect
      #   source: "/docs"
      #   destination: "/openapi.yaml"
      #   status: 302
